<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Sales Bot Control Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
    .container { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 32px; width: 100%; max-width: 620px; box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #1f2937; padding-bottom: 16px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; padding: 4px 12px; border-radius: 9999px; }
    .badge.on { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge.off { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .control-row { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 16px 20px; border-radius: 12px; margin-bottom: 24px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #475569; border-radius: 34px; transition: 0.25s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; border-radius: 50%; transition: 0.25s; }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(24px); }
    label.field-label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    textarea { width: 100%; height: 220px; background: #0b0f19; border: 1px solid #334155; border-radius: 10px; padding: 14px; color: #f1f5f9; font-size: 0.88rem; line-height: 1.5; resize: vertical; outline: none; margin-bottom: 20px; }
    textarea:focus { border-color: #38bdf8; }
    .btn-group { display: flex; gap: 12px; }
    button { flex: 1; border: none; padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .btn-secondary:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Website Sales Assistant</h1>
        <p style="font-size: 0.85rem; color: #64748b; margin-top: 2px;">WhatsApp Auto-Reply & Consultation</p>
      </div>
      <div id="statusBadge" class="badge on">
        <span class="dot"></span>
        <span id="statusText">Active</span>
      </div>
    </div>

    <div class="control-row">
      <div>
        <div style="font-weight: 600; font-size: 0.95rem;">Auto-Reply Status</div>
        <div style="font-size: 0.8rem; color: #94a3b8;">Turn incoming sales replies ON or OFF</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleSwitch" onchange="saveSettings()" />
        <span class="slider"></span>
      </label>
    </div>

    <label class="field-label" for="personaField">Sales Personality & Pricing Instructions</label>
    <textarea id="personaField" placeholder="Enter AI prompt..."></textarea>

    <div class="btn-group">
      <button class="btn-secondary" onclick="clearMemory()">Clear Chat Memory</button>
      <button class="btn-primary" onclick="saveSettings()">Save Configuration</button>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('toggleSwitch').checked = data.active;
        document.getElementById('personaField').value = data.persona;
        updateBadge(data.active);
      } catch (err) {
        console.error('Failed to load status:', err);
      }
    }

    function updateBadge(isActive) {
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      if (isActive) {
        badge.className = 'badge on';
        text.innerText = 'Online';
      } else {
        badge.className = 'badge off';
        text.innerText = 'Paused';
      }
    }

    async function saveSettings() {
      const active = document.getElementById('toggleSwitch').checked;
      const persona = document.getElementById('personaField').value;

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active, persona })
        });
        const data = await res.json();
        updateBadge(data.active);
        alert('Settings saved successfully!');
      } catch (err) {
        alert('Failed to save settings.');
      }
    }

    async function clearMemory() {
      if (!confirm('Are you sure you want to clear conversation memory for all chats?')) return;
      try {
        await fetch('/api/clear-history', { method: 'POST' });
        alert('Chat memory cleared successfully!');
      } catch (err) {
        alert('Failed to clear memory.');
      }
    }

    loadData();
  </script>
</body>
</html>
